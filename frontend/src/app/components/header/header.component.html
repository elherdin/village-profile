<header class="main-header" [class.is-scrolled]="isScrolled()">
  <div class="header-container">
    <div class="header-content">

      <!-- 1. Left: Brand & Logo -->
      <a routerLink="/" class="brand-link">
        <div class="brand-logo-container">
          <img *ngIf="profil()?.logo" [src]="profil()?.logo" alt="Logo Desa Plantungan" class="brand-logo-img">
          <div *ngIf="!profil()?.logo" class="brand-logo-fallback">
            <span>DP</span>
          </div>
        </div>
        <div class="brand-text">
          <span class="brand-title">Desa Plantungan</span>
          <span class="brand-subtitle">Kabupaten Blora</span>
        </div>
      </a>

      <!-- 2. Center: Navigation Links (Clean & Spacious) -->
      <nav class="desktop-nav">
        @for (item of navItems; track item.path) {
        <a [routerLink]="item.path" [routerLinkActiveOptions]="{ exact: item.exact ?? false }" routerLinkActive="active"
          class="nav-item-link">
          {{ item.label }}
        </a>
        }
      </nav>

      <!-- 3. Right: Single Call To Action Button (Pill Design) -->
      <div class="header-actions">
        <a routerLink="/kontak" class="cta-pill-btn">
          <span>Hubungi Kami</span>
          <svg class="cta-arrow-icon" width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
          </svg>
        </a>

        <!-- Mobile Hamburger Toggle Button -->
        <button (click)="toggleMobileMenu()" type="button" class="mobile-menu-btn" aria-label="Buka Menu">
          <svg *ngIf="!isMobileMenuOpen()" class="menu-icon" width="24" height="24" fill="none" stroke="currentColor"
            viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
          <svg *ngIf="isMobileMenuOpen()" class="menu-icon" width="24" height="24" fill="none" stroke="currentColor"
            viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

    </div>
  </div>

  <!-- Mobile Navigation Drawer -->
  <div *ngIf="isMobileMenuOpen()" class="mobile-drawer">
    <nav class="mobile-nav-list">
      @for (item of navItems; track item.path) {
      <a [routerLink]="item.path" [routerLinkActiveOptions]="{ exact: item.exact ?? false }" routerLinkActive="active"
        (click)="closeMobileMenu()" class="mobile-nav-item">
        {{ item.label }}
      </a>
      }
      <div class="mobile-cta-box">
        <a routerLink="/kontak" (click)="closeMobileMenu()" class="mobile-cta-btn">
          Hubungi Kami
        </a>
      </div>
    </nav>
  </div>
</header>
